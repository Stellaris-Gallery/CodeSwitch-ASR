[project]
name = "codeswitch-asr"
version = "0.1.0"
description = "CTC fine-tuning of a pretrained speech encoder for Mandarin-English code-switched conversation on a low-cost microphone (COMP 395 final project)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.6",
    "transformers",
    "datasets",
    "accelerate",
    "soundfile",
    "librosa",
    "pyroomacoustics",
    "jiwer",
    "pyyaml",
    "wandb",
    "matplotlib",
    "tqdm",
]

[dependency-groups]
dev = ["pytest"]

# --- PyTorch with CUDA on Windows/Linux, default (MPS) build on macOS ---
# TODO: check the CUDA version recommended on pytorch.org for the torch
# release you lock, and update "cu128" below to match.
# An RTX 50-series GPU needs CUDA 12.8 or newer.
[tool.uv.sources]
torch = [
    { index = "pytorch-cuda", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codeswitch_asr"]
