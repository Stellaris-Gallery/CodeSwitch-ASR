# Practical 50-sample XLS-R CTC overfit smoke configuration.
# Invoke with --max-train-samples 50 --max-steps 200 --device cuda.
run_name: ft_cs_dialogue_overfit
data_config: configs/data.yaml
base_model: facebook/wav2vec2-xls-r-300m
head: ctc
train_sets: [public_train]
eval_sets: [public_dev]
final_eval_sets: [public_test, ours_test]
optimizer:
  name: adamw
  lr: 1.0e-4
batch_size: 8
epochs: 20
seed: 0
output_dir: checkpoints/ft_cs_dialogue_overfit
gradient_accumulation_steps: 1
warmup_ratio: 0.1
warmup_steps: 0
scheduler: linear
mixed_precision: bf16
ctc_loss_reduction: mean
require_fresh_checkpoint: true
freeze_feature_encoder: true
feature_encoder_unfreeze_epoch: null
max_grad_norm: 1.0
dataloader_num_workers: 0
dev_subset_samples: 200
wandb:
  project: codeswitch-asr
  enabled: true
  mode: online
