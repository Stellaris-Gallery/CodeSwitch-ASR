# CS-Dialogue dataset configuration for CodeSwitch-ASR.
# Paths below are relative to CS_DIALOGUE_ROOT (the local dataset directory).
# The training data loader is not implemented yet; these fields define its contract.
seed: 0
sample_rate: 16000

public:
  name: cs_dialogue
  hf_name: BAAI/CS-Dialogue
  root_env: CS_DIALOGUE_ROOT
  audio_root: audio/short_wav
  train_index: data/index/short_wav/train
  dev_index: data/index/short_wav/dev
  test_index: data/index/short_wav/test
  train_manifest: processed/train_ctc_manifest.csv
  test_manifest: exports/test_full_6257.csv
  official_train_count: 26239
  retained_train_count: 25568
  official_dev_count: 6186
  official_test_count: 6257

ours:
  root: recordings/               # Private, git-ignored
  mic: esp32
  conversations: 3                # Planned; not yet collected
  train_conversations: []
  test_conversations: []

vocab:
  path: processed/vocab.json      # Relative to CS_DIALOGUE_ROOT
  word_delimiter: "|"
  unk_token: "[UNK]"
  blank: "<blank>"
  pad_token: "<blank>"           # Must be the same ID as CTC blank
  size: 2951                     # Generated from retained train only

augment:
  room_tone: recordings/room_tone/
  snr_db: [10]
  reverb: true                    # Simulated with pyroomacoustics
